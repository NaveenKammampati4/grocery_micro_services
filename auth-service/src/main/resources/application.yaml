server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grocery_auth}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:Naveen@70}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
#  flyway:
#    enabled: true
#    locations: classpath:db/migration
#    baseline-on-migrate: true
  sql:
    init:
      mode: always
  mail:
    host: smtp.gmail.com
    port: 587
    username: swasthaoffice@gmail.com
    password: tsua oloe naas hstn
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        auto.create.topics.enable: true  # Broker-level, but client can override
        request.timeout.ms: 30000
        metadata.max.idle: 300000
    admin:
      properties:
        auto.create: true  # Spring Boot 3+ auto-creates on startup
    bootstrap-servers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    instance-id: ${spring.application.name}:${server.port}

app:
  jwtSecret: ${JWT_SECRET:dev-secret-for-grocerymart-14052000}
  jwtExpirationMs: 86400000  # 24 hours
  jwtRefreshExpirationMs: 604800000   # 7 days
  security:
    default:
      registration:
        role: CUSTOMER

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
        exclude: env,beans,mappings,shutdown
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
      probes:
        enabled: true
    info:
      env:
        enabled: true
  server:
    port: 8081
    address: 127.0.0.1

