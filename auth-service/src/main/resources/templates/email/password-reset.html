<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .button { background: #007bff; color: white; padding: 12px 24px; text-decoration: none;
            border-radius: 6px; display: inline-block; font-weight: 500; }
        .code { background: #f8f9fa; padding: 8px 12px; border-radius: 4px; font-family: monospace; }
        .footer { margin-top: 30px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <h2>🔒 Password Reset Request</h2>
    <p>Hi <strong th:text="${userName}">User</strong>,</p>

    <p>You requested a password reset. Use the button below (expires in <strong>1 hour</strong>):</p>

    <a th:href="${resetUrl}" class="button" th:text="'Reset Password'">Reset Password</a>

    <p><em>Or copy this token directly:</em></p>
    <div class="code" th:text="${token}">your-token-here</div>

    <hr>
    <p><small>
        If you didn't request this, ignore this email. No action needed.
        <br><strong>Token expires:</strong> <span th:text="${expiryTime}">Soon</span>
    </small>
    </p>
    <p class="footer">
        © 2026 GroceryMart | <a th:href="${appUrl}">Your App</a>
    </p>
</div>
</body>
</html>
