server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          # ------------------------
          # Routes configuration
          # ------------------------
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**, /api/admin/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 50
                    key-resolver: "#{@userKeyResolver}"

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    key-resolver: "#{@userKeyResolver}"

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    key-resolver: "#{@userKeyResolver}"

          # ------------------------
          # Default filters
          # ------------------------
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

          # ------------------------
          # Global CORS configuration
          # ------------------------
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600

# ------------------------
# Eureka configuration
# ------------------------
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ------------------------
# Rate limiting key resolver
# ------------------------
gateway:
  rate-limit:
    user-key-resolver: true

# ------------------------
# Management endpoints
# ------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      show-details: always

# ------------------------
# JWT settings
# ------------------------
app:
  jwt:
    secret: dev-secret-for-grocerymart-14052000
    expiration: 86400000

# ------------------------
# Logging configuration
# ------------------------
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG

